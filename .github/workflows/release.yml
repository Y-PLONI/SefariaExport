name: Weekly 2/6 · Export and publish immutable Sefaria

run-name: Sefaria immutable export orchestration=${{ inputs.orchestration_id || format('standalone:{0}:{1}', github.run_id, github.run_attempt) }}

on:
  workflow_dispatch:
    inputs:
      timezone:
        description: Timezone for the human-readable part of the tag (IANA name)
        required: false
        default: Asia/Jerusalem
      post_to_forum:
        description: Publish the display-only changelog to the Otzaria forum
        type: boolean
        required: false
        default: true
      allow_initial_baseline:
        description: Allow previous:null when bootstrapping the first immutable release
        type: boolean
        required: false
        default: false
      orchestration_id:
        description: Exact weekly dispatcher identity; empty for a standalone export
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sefaria-export-release
  cancel-in-progress: false
  # Each queued export is a distinct weekly intent.  Preserve every pending
  # release instead of allowing a later dispatch to supersede it.
  queue: max

env:
  TZ_NAME: ${{ inputs.timezone || 'Asia/Jerusalem' }}

jobs:
  export_release:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout exact exporter commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Validate release tooling
        run: |
          python3 -m pip install --quiet requests beautifulsoup4 pyluach tzdata
          python3 -m unittest -v test_link_visibility.py test_release_contract.py test_downstream_intent.py test_reconcile_downstream.py test_resolve_release_chain_head.py test_release_workflow_contract.py test_post_to_forum.py

      - name: Validate optional orchestration identity
        env:
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
        shell: bash
        run: |
          set -euo pipefail
          [ -z "$ORCHESTRATION_ID" ] || [[ "$ORCHESTRATION_ID" =~ ^weekly:[1-9][0-9]*:[1-9][0-9]*$ ]]

      - name: Compute immutable tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(TZ="${TZ_NAME}" date '+%Y-%m-%d_%H-%M')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$stamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]+-[0-9]+$ ]]
          echo "tag=$stamp" >> "$GITHUB_OUTPUT"

      - name: Resolve the exact previous immutable release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_INITIAL: ${{ inputs.allow_initial_baseline }}
        shell: bash
        run: |
          set -euo pipefail
          python3 resolve_release_chain_head.py \
            --repo "$GITHUB_REPOSITORY" \
            --output previous-resolution.json \
            --allow-initial-baseline "$ALLOW_INITIAL"
          is_initial="$(jq -r '.is_initial' previous-resolution.json)"
          [[ "$is_initial" == true || "$is_initial" == false ]]
          echo "is_initial=$is_initial" >> "$GITHUB_OUTPUT"
          if [[ "$(jq -r '.has_immutable_chain' previous-resolution.json)" != true ]]; then
            [[ "$is_initial" == true ]]
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "metadata_sha256=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$is_initial" == false ]]
          previous_tag="$(jq -r '.tag' previous-resolution.json)"
          expected_metadata_sha="$(jq -r '.metadata_sha256' previous-resolution.json)"
          mkdir previous-release
          gh release download "$previous_tag" --pattern release_metadata.json --dir previous-release
          metadata_sha="$(python3 release_contract.py validate --metadata previous-release/release_metadata.json)"
          [[ "$metadata_sha" == "$expected_metadata_sha" ]]
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "metadata_sha256=$metadata_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the exporter image with a shared layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # Tagged and loaded so the compose step below reuses this exact image
          # instead of building its own.
          tags: sefaria-exporter:local
          load: true
          # Without a cache every weekly rebuilds the whole image from scratch,
          # so one hiccup on any package host costs the entire cycle.  A failure
          # of the cache service itself must never do that, hence ignore-error.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Run export pipeline via Docker Compose
        env:
          TS_STAMP: ${{ steps.release.outputs.tag }}
        run: docker compose up --abort-on-container-exit

      - name: Stop and clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Collect required release inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" ./output
          shopt -s nullglob
          archives=(./output/sefaria-exports-*.tar.zst*)
          [[ ${#archives[@]} -gt 0 ]]
          mv "${archives[@]}" ./
          mv ./output/manifest.txt ./manifest.txt
          mv ./output/titles.json ./titles.json
          test -s manifest.txt
          test -s titles.json

      - name: Ensure GitHub CLI
        run: bash ./19_ensure_gh_cli.sh

      - name: Generate full machine changelog and filtered forum copy
        env:
          GH_TOKEN: ${{ github.token }}
          TS_STAMP: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          python3 -m pip install --quiet requests beautifulsoup4 pyluach tzdata
          bash ./22_generate_changelog.sh

      - name: Build canonical release metadata
        id: metadata
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_METADATA_SHA256: ${{ steps.previous.outputs.metadata_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(sefaria-exports-*.tar.zst.part-*)
          if [[ ${#parts[@]} -eq 0 ]]; then
            parts=(sefaria-exports-*.tar.zst)
          fi
          [[ ${#parts[@]} -gt 0 ]]
          args=()
          for part in "${parts[@]}"; do args+=(--archive-part "$part"); done
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--previous-tag "$PREVIOUS_TAG" --previous-metadata-sha256 "$PREVIOUS_METADATA_SHA256")
          fi
          metadata_sha="$(python3 release_contract.py build \
            --tag "$TAG" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-commit "$GITHUB_SHA" \
            "${args[@]}" \
            --manifest manifest.txt \
            --titles titles.json \
            --changelog changelog_diff.json \
            --output release_metadata.json)"
          echo "sha256=$metadata_sha" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$(jq -r '.archive.sha256' release_metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Build immutable downstream intent
        if: steps.previous.outputs.is_initial == 'false'
        id: downstream_intent
        env:
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          asset_name="$(python3 downstream_intent.py build \
            --source-repo "$SOURCE_REPO" \
            --metadata release_metadata.json \
            --output-dir .)"
          [[ "$asset_name" =~ ^downstream-intent-[0-9a-f]{64}\.json$ ]]
          test -s "$asset_name"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Create draft and upload immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          INTENT_ASSET: ${{ steps.downstream_intent.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; immutable releases are never overwritten." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Sefaria Export $TAG" \
            --notes-file RELEASE_NOTES.md
          mapfile -t archive_names < <(jq -r '.archive.parts[].name' release_metadata.json)
          intent_assets=()
          if [[ -n "$INTENT_ASSET" ]]; then
            [[ "$INTENT_ASSET" =~ ^downstream-intent-[0-9a-f]{64}\.json$ ]]
            test -s "$INTENT_ASSET"
            intent_assets+=("$INTENT_ASSET")
          fi
          gh release upload "$TAG" \
            "${archive_names[@]}" \
            manifest.txt titles.json changelog_diff.json release_metadata.json \
            CHANGELOG.md forum_changelog_diff.json "${intent_assets[@]}"

      - name: Download and verify every uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_METADATA_SHA: ${{ steps.metadata.outputs.sha256 }}
          INTENT_ASSET: ${{ steps.downstream_intent.outputs.asset_name }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-verification
          mkdir release-verification
          gh release download "$TAG" --dir release-verification
          actual_metadata_sha="$(python3 release_contract.py validate \
            --metadata release-verification/release_metadata.json \
            --asset-dir release-verification)"
          [[ "$actual_metadata_sha" == "$EXPECTED_METADATA_SHA" ]]
          for display_asset in CHANGELOG.md forum_changelog_diff.json; do
            cmp "$display_asset" "release-verification/$display_asset"
            [[ "$(stat -c '%s' "$display_asset")" == "$(stat -c '%s' "release-verification/$display_asset")" ]]
            [[ "$(sha256sum "$display_asset" | cut -d' ' -f1)" == "$(sha256sum "release-verification/$display_asset" | cut -d' ' -f1)" ]]
          done
          if [[ -n "$INTENT_ASSET" ]]; then
            python3 downstream_intent.py validate \
              --source-repo "$SOURCE_REPO" \
              --metadata release-verification/release_metadata.json \
              --intent "release-verification/$INTENT_ASSET" >/dev/null
          fi
          expected_assets="$(jq -r --arg intent "$INTENT_ASSET" \
            '[.archive.parts[].name, .manifest.name, .titles.name, .changelog.name,
              "release_metadata.json", "CHANGELOG.md", "forum_changelog_diff.json"]
             + (if $intent == "" then [] else [$intent] end) | sort | .[]' \
            release_metadata.json)"
          remote_assets="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | .[]')"
          [[ "$remote_assets" == "$expected_assets" ]]
          remote_target="$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')"
          [[ "$remote_target" == "$GITHUB_SHA" ]]

      - name: Publish verified release last
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          tag_target="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          [[ "$tag_target" == "$GITHUB_SHA" ]]

      - name: Publish display-only changelog to forum
        if: ${{ inputs.post_to_forum }}
        continue-on-error: true
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          POST_TO_FORUM: "true"
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 post_to_forum.py forum_changelog_diff.json --tag "$TAG" --topic "${FORUM_TOPIC_ID:-1617}" --new-books-topic "${FORUM_NEW_BOOKS_TOPIC_ID:-1994}" --titles titles.json --prev-titles prev_titles.json

      - name: Dispatch exact manual-link synchronization
        if: steps.previous.outputs.is_initial == 'false'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The helper performs a read-before-write and submits at most once.
          # If the response is lost, this job fails without a blind retry; the
          # scheduled reconciler will observe the durable release intent first.
          python3 reconcile_downstream.py --source-repo "$SOURCE_REPO" --tag "$TAG"
