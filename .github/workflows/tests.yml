name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # The forum client is imported by test_post_to_forum.py, so its runtime
      # dependencies have to exist before the suite runs.
      - name: Install test dependencies
        run: python3 -m pip install --quiet requests beautifulsoup4 pyluach tzdata

      - name: Run exporter and release-tool tests
        run: python3 -m unittest discover -v
