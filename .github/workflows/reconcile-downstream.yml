name: Recovery guard · Deliver Sefaria downstream intent (not a build stage)

run-name: reconcile Sefaria downstream intents ${{ github.run_id }}-${{ github.run_attempt }}

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional exact Sefaria release tag; empty scans every durable intent
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sefaria-downstream-reconcile
  cancel-in-progress: false
  # Timer ticks are observations, not distinct intents.  One pending tick is
  # sufficient because every invocation scans the immutable intent store.

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
      SOURCE_REPO: ${{ github.repository }}
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout exact reconciler
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Validate reconciler contracts
        run: python3 -m unittest -v test_link_visibility.py test_release_contract.py test_downstream_intent.py test_reconcile_downstream.py test_release_workflow_contract.py

      - name: Reconcile all durable release intents
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          args=(--source-repo "$SOURCE_REPO")
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]+-[0-9]+$ ]]
            args+=(--tag "$REQUESTED_TAG")
          fi
          python3 reconcile_downstream.py "${args[@]}"
