name: Forum backfill · Re-publish a changelog post that never landed

run-name: Forum backfill ${{ inputs.only }} for ${{ inputs.tags }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Between 2026-07-24 and 2026-09-01 the release job sent both changelog posts in
# a tight loop.  The forum refuses a second post inside its post-rate window, so
# the "ספרים חדשים" post was rejected on every single release while the log still
# printed "✅ Posted".  post_to_forum.py now spaces and verifies its posts; this
# workflow re-publishes the posts that were lost before that fix.
#
# The post text is NOT stored anywhere: it is rebuilt from the release's own
# `forum_changelog_diff.json` asset, so a backfill reproduces exactly what that
# release would have published, dated by that release's own day.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags to re-publish, separated by spaces or commas
        type: string
        required: true
      only:
        description: Which thread to write
        type: choice
        required: false
        default: new-books
        options:
          - new-books
          - changes
          - both
      dry_run:
        description: Print the posts without sending them
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  # One forum writer at a time: concurrent runs would trip the same post-rate
  # limit this workflow exists to work around.
  group: otzaria-forum-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exporter
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install dependencies
        run: python3 -m pip install --quiet requests beautifulsoup4 pyluach tzdata

      - name: Validate the forum publisher before using it
        run: python3 -m unittest -v test_post_to_forum.py

      - name: Re-publish each release's post
        env:
          GH_TOKEN: ${{ github.token }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          POST_TO_FORUM: ${{ inputs.dry_run && 'false' || 'true' }}
          ONLY: ${{ inputs.only }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a tags <<< "${TAGS//,/ }"
          [[ ${#tags[@]} -gt 0 ]]
          rm -rf backfill && mkdir backfill
          failures=0
          first=1
          for tag in "${tags[@]}"; do
            # Each tag is its own post_to_forum.py run, so the in-process delay
            # does not span them: space the tags here or the second one walks
            # straight into the post-rate window this workflow exists to dodge.
            if [[ "$first" -eq 0 ]]; then sleep 5; else first=0; fi
            [[ "$tag" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]+-[0-9]+$ ]] || {
              echo "❌ '$tag' is not an immutable export tag"; exit 1; }
            dir="backfill/$tag"
            mkdir -p "$dir"
            # The release's own display diff is the source of truth for what that
            # release would have posted — nothing is reconstructed by hand.
            gh release download "$tag" -p forum_changelog_diff.json -D "$dir"
            test -s "$dir/forum_changelog_diff.json"
            echo "::group::$tag ($ONLY)"
            if python3 post_to_forum.py "$dir/forum_changelog_diff.json" \
                 --tag "$tag" --only "$ONLY" --as-of "${tag%%_*}"; then
              echo "✅ $tag done"
            else
              echo "❌ $tag did not fully publish"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          [[ "$failures" -eq 0 ]] || { echo "❌ $failures tag(s) failed"; exit 1; }
