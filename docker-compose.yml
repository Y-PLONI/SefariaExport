services:
  mongodb:
    image: mongo:6.0
    container_name: sefaria-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    # Constrain MongoDB memory to prevent OOM kills.
    #
    # `--quiet` trims mongod's per-connection NETWORK chatter.  mongod documents
    # it as suppressing database-command output, replication activity and
    # connection accepted/closed events — 2,578 of the 6,286 mongod lines in run
    # 33987734987.  The 1,288 `"msg":"client metadata"` lines are NOT on that
    # documented list, so treat `--quiet` as a partial measure: what actually
    # keeps mongod out of the job log is `--no-attach mongodb` in release.yml.
    # `--quiet` suppresses nothing at severity W/E/F, and the release workflow
    # replays those separately after the run — this cuts duplication, not
    # diagnostics.
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "2.5"]
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 20

  exporter:
    # Named so the release workflow can build this image once through BuildKit
    # with a reusable layer cache and have `up` reuse it; a bare
    # `docker compose up` still builds it from the same Dockerfile when the tag
    # is not present locally.
    image: sefaria-exporter:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sefaria-exporter
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - TZ=Asia/Jerusalem
      - DJANGO_SETTINGS_MODULE=sefaria.settings
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=sefaria
      - SEFARIA_EXPORT_PATH=/app/exports
      - TS_STAMP=${TS_STAMP:-}
    volumes:
      - ./exports:/app/exports
      - ./output:/app/output
    # Increase shared memory for MongoDB operations
    shm_size: 2gb

volumes:
  mongodb_data:
